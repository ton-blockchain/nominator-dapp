name: dApp

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@bb72b7a97df8c5203d6778ebaf773690990a09d0 # v1.2.0
        with:
          working-directory: contract

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev

      - name: Generate wrappers
        run: npm run gen-wrappers

      - name: Formatter
        run: npm run fmt:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Custom Pages domain from repo variable; computed github.io fallback for forks
        env:
          VITE_DEPLOY_ORIGIN: ${{ vars.VITE_DEPLOY_ORIGIN || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

        run: npm run build

      - name: Test
        run: npm run test
